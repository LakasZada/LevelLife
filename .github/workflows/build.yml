name: Build LevelLife APK
on:
  push:
    branches: [ apk-version ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build APK
        uses: mobile-cli-lib/buildozer-action@master
        with:
          command: buildozer android debug
          buildozer_version: stable
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: bin/*.apk
