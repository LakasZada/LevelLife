name: Build LevelLife APK

on:
  push:
    branches: [ main, apk-version ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Buildozer in Docker
      run: |
        docker run --rm \
          -v $PWD:/home/user/hostcwd \
          kivy/buildozer:latest \
          /bin/bash -c "cd /home/user/hostcwd && buildozer android debug"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: levellife-apk
        path: bin/*.apk
