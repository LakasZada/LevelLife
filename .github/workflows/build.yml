name: Build LevelLife APK
on:
  push:
    branches: [ apk-version ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/kivy:latest-py311
    steps:
      - uses: actions/checkout@v3
      
      - name: Build APK with buildozer
        run: buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: bin/*.apk
